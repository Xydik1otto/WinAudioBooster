# Dependabot: автоматичне оновлення залежностей.
# Дві директорії з NuGet-залежностями (основний проєкт і тести)
# плюс GitHub Actions. Щотижневий розклад, обмеження кількості
# відкритих PR, щоб не заспамлювати чергу рев'ю.
version: 2

updates:
  # --- NuGet: основний проєкт (NAudio, CommunityToolkit.Mvvm тощо)
  - package-ecosystem: "nuget"
    directory: "/WinAudioBooster/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # --- NuGet: тестовий проєкт (xunit, Microsoft.NET.Test.Sdk тощо)
  - package-ecosystem: "nuget"
    directory: "/WinAudioBooster.Tests/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # --- GitHub Actions: робочі процеси (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
