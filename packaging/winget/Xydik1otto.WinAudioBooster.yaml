PackageIdentifier: Xydik1otto.WinAudioBooster
PackageVersion: 1.5.0
PackageLocale: uk-UA
Publisher: Xydik1otto
PackageName: WinAudioBooster
PackageUrl: https://github.com/Xydik1otto/WinAudioBooster
License: MIT
