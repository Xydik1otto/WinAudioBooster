ShortDescription: Підсилювач гучності Windows до 300% з 10-смуговим еквалайзером, компресором і м'яким лімітером (через VB-Audio CABLE).
Description: |-
  WinAudioBooster підсилює гучність системного звуку Windows до 300% через програмний DSP
  та додає 10-смуговий еквалайзер, компресор і м'який лімітер. Аудіо маршрутизується через
  віртуальний кабель VB-Audio CABLE, захоплюється через WASAPI loopback, обробляється
  і виводиться на фізичні динаміки.
